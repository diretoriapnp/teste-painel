<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de conexão</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;color:#1b2a4a}
  h1{font-size:1.3rem}
  label{display:block;margin:14px 0 4px;font-weight:600}
  input{width:100%;padding:10px;border:1px solid #c9d3e0;border-radius:8px;font:inherit;box-sizing:border-box}
  button{margin-top:14px;padding:10px 18px;border:0;border-radius:8px;background:#1b2a4a;color:#fff;font:inherit;cursor:pointer}
  .r{margin-top:18px;padding:12px;border-radius:8px;background:#eef2f7}
  .ok{color:#0a7a3d;font-weight:700}.erro{color:#a1233b;font-weight:700}
</style>
</head>
<body>
<h1>Teste de conexão do painel</h1>
<p class="ok">Passo 1 concluído: esta página abriu. A hospedagem funciona nesta rede.</p>
<p>Passo 2: teste a conexão com o Supabase. Cole abaixo a chave <b>anon</b> (ou "publishable") do projeto. Ela só é usada neste navegador e não é guardada.</p>

<label for="url">Endereço do projeto</label>
<input id="url" value="https://gglhalkhueoxpypdrxjc.supabase.co">
<label for="key">Chave anon / publishable</label>
<input id="key" placeholder="cole aqui a chave anon">
<button id="go" type="button">Testar conexão</button>

<div class="r" id="out">Aguardando o teste.</div>

<script>
document.getElementById('go').onclick = async function () {
  var url = document.getElementById('url').value.trim().replace(/\/$/, '');
  var key = document.getElementById('key').value.trim();
  var out = document.getElementById('out');
  if (!key) { out.innerHTML = '<span class="erro">Cole a chave anon primeiro.</span>'; return; }
  out.textContent = 'Testando...';
  var linhas = [];
  async function t(nome, caminho) {
    try {
      var r = await fetch(url + caminho, {headers: {apikey: key, Authorization: 'Bearer ' + key}});
      linhas.push('<div>' + nome + ': <span class="' + (r.ok ? 'ok' : 'erro') + '">' + (r.ok ? 'funcionou' : 'respondeu com erro ' + r.status) + '</span></div>');
    } catch (e) {
      linhas.push('<div>' + nome + ': <span class="erro">bloqueado ou sem resposta</span></div>');
    }
  }
  await t('Login (Auth)', '/auth/v1/settings');
  await t('Banco de dados (API)', '/rest/v1/');
  await t('Arquivos (Storage)', '/storage/v1/bucket');
  out.innerHTML = linhas.join('') + '<p>Se os três funcionaram, a rede permite tudo o que o painel precisa. "Respondeu com erro" também é aceitável nesta fase, desde que não diga "bloqueado".</p>';
};
</script>
</body>
</html>
